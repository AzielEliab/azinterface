name = "azinterface-download-tracker"
main = "src/entry.js"
compatibility_date = "2026-09-06"
workers_dev = true
# Public in sibling AzielEliab *Lock Workers. First deploy must use this account.
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Parent-deploy note: DOWNLOADS id is still the 0000… placeholder.
# Real AZINTERFACE_DOWNLOADS production id was not in comments/README
# and is not visible to this agent's Cloudflare KV list. Do not invent
# an id. Parent must create the namespace and replace this id before
# wrangler deploy:
#   npx wrangler kv namespace create AZINTERFACE_DOWNLOADS
# Then set id below and run:
#   npx wrangler deploy
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "c7f3fab13653463e8c84b534bcf745b6"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/aznews", "/aznews/", "/newsmap", "/newsmap/", "/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/robots.txt", "/sitemap.xml", "/cite.json", "/llms.txt", "/ai.txt"]

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"
# Local verified copies (src/news-copy.js): host label and the pinned runtime tether key
# (public key only; the same key AZ-OS pins). Packets signed by any other key are refused.
COPY_HOST = "azinterface"
RUNTIME_TETHER_PUBKEY = "C9Psex_Bf8uG_nCwIeiskejJaBYUSYn7lHkPm4qV6Ik"

[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

# AZInterface's own verified copies of the runtime AZNews store and 4DMap store
# (signed tether AZRT-AZOS-NEWS-1.0 / AZRT-MAP-COPY-1.0). SQLite Durable Object only; no KV or D1 writes.
[[durable_objects.bindings]]
name = "LOCAL_NEWS_COPY"
class_name = "LocalNewsCopy"

[[migrations]]
tag = "azinterface-local-copy-v1"
new_sqlite_classes = ["LocalNewsCopy"]

[observability]
enabled = true
head_sampling_rate = 1
